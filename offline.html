<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2E51A2">
  <title>Offline - MyAnimeList</title>
  <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/7/7a/MyAnimeList_Logo.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .offline-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .offline-card {
      max-width: 560px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      padding: 32px;
      text-align: center;
    }
    .offline-card h1 { margin-top: 0; }
    .offline-card p { color: #555; line-height: 1.6; }
    .offline-card a {
      display: inline-block;
      margin-top: 12px;
      background: #2E51A2;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
    }
    @media (prefers-color-scheme: dark) {
      .offline-card { background: #1f1f1f; }
      .offline-card p { color: #ccc; }
    }
  </style>
</head>
<body>
  <div class="offline-wrap">
    <div class="offline-card">
      <h1>You’re offline</h1>
      <p>The MyAnimeList prototype is still installed, but this page or some live anime data could not be reached right now.</p>
      <p>Reconnect to the internet and try again, or go back to a page you already opened before.</p>
      <a href="index.html">Return Home</a>
    </div>
  </div>
</body>
</html>
