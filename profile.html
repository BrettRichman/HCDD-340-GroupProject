<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header">
        <span>
            MyAnimeList
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="#">Browse</a></li>
                    <li><a href="community.html">Community</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            </nav>
        </span>
    </div>

    <section class="profile-page">
        <section class="profile-page">
    <!-- Profile Header -->
    <div class="profile-header">
        <div class="profile-banner"></div>
        <div class="profile-info">
            <div class="avatar"></div>
            <div class="user-details">
                <h2>Username</h2>
                <p>Anime Enthusiast</p>
            </div>
        </div>
    </div>

    <!-- Stats + Friends -->
    <div class="profile-content">

        <!-- Anime Stats -->
        <div class="profile-card">
            <h3>Anime Stats</h3>

            <div class="stat-bar">
                <span>Watching</span>
                <div class="bar"><div class="fill watching"></div></div>
                <span>12</span>
            </div>

            <div class="stat-bar">
                <span>Completed</span>
                <div class="bar"><div class="fill completed"></div></div>
                <span>54</span>
            </div>

            <div class="stat-bar">
                <span>On-Hold</span>
                <div class="bar"><div class="fill onhold"></div></div>
                <span>6</span>
            </div>

            <div class="stat-bar">
                <span>Dropped</span>
                <div class="bar"><div class="fill dropped"></div></div>
                <span>3</span>
            </div>

            <div class="stat-bar">
                <span>Plan to Watch</span>
                <div class="bar"><div class="fill plantowatch"></div></div>
                <span>120</span>
            </div>

            <div class="totals">
                <p><strong>Total Entries:</strong> 195</p>
                <p><strong>Episodes Watched:</strong> 2,340</p>
            </div>
        </div>

        <!-- Friends -->
        <div class="profile-card">
            <h3>Friends (8)</h3>

            <div class="friends-grid">
                <div class="friend"></div>
                <div class="friend"></div>
                <div class="friend"></div>
                <div class="friend"></div>
                <div class="friend"></div>
                <div class="friend"></div>
                <div class="friend"></div>
                <div class="friend"></div>
            </div>
        </div>

    </div>
</section>    </section>

</body>
</html>
