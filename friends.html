    <link rel="preconnect" href="https://fonts.googleapis.com">

<header class="header">
  <span>
    <span class="brand">MyAnimeList</span>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Browse</a></li>

<main>
  <section class="browse-hero">
    <h1>Manage Friends</h1>
    <p>Search for users, send requests, and manage your friends list.</p>
  </section>

  <section class="friends-page-grid">

    <div class="profile-card">
      <h3>Find Friends</h3>
      <input id="friend-search" class="friend-search" placeholder="Search username">
      <div id="friend-results" class="friend-results"></div>
    </div>

    <div class="profile-card">
      <h3>Friend Requests</h3>
      <div id="friend-requests" class="friend-results"></div>
    </div>

    <div class="profile-card">
      <h3>Your Friends</h3>
      <div id="friends-grid" class="friends-grid"></div>
    </div>

  </section>

<script src="main.js"></script>
